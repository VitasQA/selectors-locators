plugins {
    id 'java'
    id 'io.qameta.allure' version '3.0.2' apply false
}

allprojects {
    repositories { mavenCentral() }
    group = 'org.hw_11'
    version = '1.0-SNAPSHOT'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.qameta.allure'

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.14.3'
        testImplementation 'org.junit.platform:junit-platform-launcher:1.14.3'
        testImplementation 'org.assertj:assertj-core:3.27.7'
        testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
        testImplementation "io.qameta.allure:allure-junit5:2.27.0"
        testRuntimeOnly 'org.aspectj:aspectjweaver:1.9.22'
    }
}

tasks.register('smokeApi') { dependsOn ':api-tests:test' }
tasks.register('smokeUi') { dependsOn ':ui-tests:test' }