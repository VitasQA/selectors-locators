dependencies {
    implementation project(':common')
    testImplementation 'com.codeborne:selenide:7.14.0'
    testImplementation "io.qameta.allure:allure-selenide:2.27.0"
}

test {
    useJUnitPlatform()
    jvmArgs "-javaagent:${configurations.testRuntimeClasspath.find { it.name.contains('aspectjweaver') }}"
    systemProperty 'allure.results.directory', "${project.buildDir}/allure-results"
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat 'full' }
}